<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>투명 여백 자동 제거</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f4ef;
      --panel: #ffffff;
      --ink: #1d2522;
      --muted: #66736d;
      --line: #d8ddd7;
      --accent: #167a6d;
      --accent-dark: #0f5f55;
      --danger: #a23b3b;
      --shadow: 0 18px 45px rgba(29, 37, 34, 0.10);
      --radius: 8px;
      font-family: Inter, Pretendard, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(0deg, rgba(255,255,255,0.54), rgba(255,255,255,0.54)),
        repeating-linear-gradient(45deg, #ebe8df 0 12px, #f4f1e9 12px 24px);
      color: var(--ink);
    }

    main {
      width: min(1120px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 32px 0;
    }

    .app-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 4vw, 42px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 8px 0 0;
      max-width: 620px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    button,
    .file-button {
      border: 0;
      border-radius: 7px;
      background: var(--accent);
      color: #fff;
      min-height: 40px;
      padding: 0 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background .15s ease, transform .15s ease, opacity .15s ease;
      white-space: nowrap;
    }

    button:hover,
    .file-button:hover {
      background: var(--accent-dark);
    }

    button:active,
    .file-button:active {
      transform: translateY(1px);
    }

    button.secondary {
      background: #e4ece9;
      color: #164c45;
    }

    button.secondary:hover {
      background: #d8e4df;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none;
    }

    input[type="file"] {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(280px, 360px) 1fr;
      gap: 18px;
      align-items: start;
    }

    .drop-zone {
      min-height: 330px;
      border: 2px dashed #a9b9b1;
      border-radius: var(--radius);
      background: rgba(255, 255, 255, .72);
      padding: 22px;
      display: grid;
      place-items: center;
      text-align: center;
      box-shadow: var(--shadow);
      transition: border-color .15s ease, background .15s ease, transform .15s ease;
    }

    .drop-zone.dragging {
      border-color: var(--accent);
      background: #effaf7;
      transform: translateY(-2px);
    }

    .drop-zone:focus-visible {
      outline: 3px solid rgba(22, 122, 109, .28);
      outline-offset: 3px;
    }

    .drop-zone strong {
      display: block;
      font-size: 22px;
      margin-bottom: 8px;
    }

    .drop-zone span {
      color: var(--muted);
      line-height: 1.5;
      font-size: 14px;
    }

    .settings {
      margin-top: 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .setting-row {
      display: grid;
      gap: 10px;
      margin-bottom: 16px;
    }

    .setting-row:last-child {
      margin-bottom: 0;
    }

    .setting-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      font-size: 14px;
      font-weight: 700;
    }

    .setting-head output {
      color: var(--accent-dark);
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    label.checkbox {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      flex: 0 0 auto;
    }

    kbd {
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      padding: 1px 6px;
      border: 1px solid #cbd5d1;
      border-bottom-width: 2px;
      border-radius: 5px;
      background: #f8faf9;
      color: var(--ink);
      font: 700 12px/1.2 "Segoe UI", system-ui, sans-serif;
      white-space: nowrap;
    }

    .preview {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .status {
      min-height: 22px;
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 14px;
    }

    .status.error {
      color: var(--danger);
      font-weight: 700;
    }

    .comparison {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .result-list {
      display: grid;
      gap: 16px;
    }

    .result-item {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      overflow: hidden;
    }

    .result-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
      border-bottom: 1px solid var(--line);
    }

    .result-name {
      min-width: 0;
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .result-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .result-actions button {
      min-height: 34px;
      padding: 0 11px;
      font-size: 13px;
    }

    .result-body {
      padding: 12px;
    }

    .pane {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      background: #fff;
      min-width: 0;
    }

    .pane-header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
      font-weight: 800;
    }

    .pane-header span:last-child {
      color: var(--muted);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .canvas-wrap {
      min-height: 330px;
      padding: 14px;
      display: grid;
      place-items: center;
      background-color: #fff;
      background-image:
        linear-gradient(45deg, #dfe5e1 25%, transparent 25%),
        linear-gradient(-45deg, #dfe5e1 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #dfe5e1 75%),
        linear-gradient(-45deg, transparent 75%, #dfe5e1 75%);
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
      background-size: 20px 20px;
    }

    canvas {
      max-width: 100%;
      max-height: 420px;
      width: auto;
      height: auto;
      image-rendering: auto;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .14);
    }

    .empty {
      min-height: 160px;
      display: grid;
      place-items: center;
      color: var(--muted);
      text-align: center;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(45deg, #f3f6f4 25%, transparent 25%),
        linear-gradient(-45deg, #f3f6f4 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #f3f6f4 75%),
        linear-gradient(-45deg, transparent 75%, #f3f6f4 75%);
      background-color: #fff;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
      background-size: 20px 20px;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    body.office-host {
      background: #f7f8f7;
    }

    body.office-host main {
      width: min(100vw - 20px, 460px);
      padding: 12px 0 16px;
    }

    body.office-host .app-header,
    body.office-host .layout,
    body.office-host .comparison {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    body.office-host h1 {
      font-size: 22px;
      line-height: 1.15;
    }

    body.office-host .subtitle {
      margin-top: 6px;
      font-size: 13px;
      line-height: 1.45;
    }

    body.office-host .toolbar,
    body.office-host .actions,
    body.office-host .result-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      justify-content: stretch;
    }

    body.office-host .file-button,
    body.office-host button {
      width: 100%;
      min-height: 38px;
      padding: 0 10px;
      font-size: 14px;
    }

    body.office-host .drop-zone {
      min-height: 142px;
      padding: 18px 14px;
      border-style: solid;
      background: #fff;
      box-shadow: none;
    }

    body.office-host .drop-zone strong {
      font-size: 18px;
      line-height: 1.25;
    }

    body.office-host .drop-zone span {
      font-size: 13px;
    }

    body.office-host .settings,
    body.office-host .preview {
      padding: 12px;
      box-shadow: none;
    }

    body.office-host .setting-row {
      gap: 8px;
      margin-bottom: 12px;
    }

    body.office-host .download-option,
    body.office-host #downloadButton,
    body.office-host .download-one {
      display: none;
    }

    body.office-host #insertPptButton,
    body.office-host .insert-one {
      background: var(--accent);
      color: #fff;
    }

    body.office-host #insertPptButton:hover,
    body.office-host .insert-one:hover {
      background: var(--accent-dark);
    }

    body.office-host .result-top {
      display: grid;
      align-items: stretch;
      gap: 8px;
      padding: 10px;
    }

    body.office-host .result-body {
      padding: 10px;
    }

    body.office-host .pane-header {
      padding: 8px 10px;
      font-size: 12px;
    }

    body.office-host .canvas-wrap {
      min-height: 160px;
      padding: 10px;
    }

    body.office-host canvas {
      max-height: 260px;
    }

    body.office-host .empty {
      min-height: 96px;
      padding: 12px;
      font-size: 13px;
    }

    body.office-host .status {
      margin-bottom: 10px;
      font-size: 13px;
    }

    @media (max-width: 820px) {
      main {
        width: min(100vw - 20px, 640px);
        padding: 18px 0;
      }

      .app-header,
      .layout,
      .comparison {
        grid-template-columns: 1fr;
      }

      .result-top {
        align-items: stretch;
        flex-direction: column;
      }

      .result-actions {
        justify-content: flex-end;
      }

      .app-header {
        display: grid;
        align-items: start;
      }

      .toolbar {
        justify-content: flex-start;
      }

      .drop-zone {
        min-height: 220px;
      }

      .preview {
        min-height: 0;
      }

      .canvas-wrap {
        min-height: 260px;
      }

      .empty {
        min-height: 130px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="app-header">
      <div>
        <h1>투명 여백 자동 제거</h1>
        <p class="subtitle" id="subtitle">PNG, WebP처럼 투명도를 가진 이미지를 드래그하면 알파값 기준으로 실제 픽셀 영역만 잘라냅니다.</p>
      </div>
      <div class="toolbar">
        <label class="file-button" id="fileButton" for="fileInput">이미지 여러 장 선택</label>
        <input id="fileInput" type="file" accept="image/*" multiple>
        <button class="secondary" id="resetButton" type="button" disabled>초기화</button>
      </div>
    </header>

    <section class="layout">
      <aside>
        <div class="drop-zone" id="dropZone" tabindex="0">
          <div>
            <strong id="dropZoneTitle">이미지를 여기에 놓기</strong>
            <span id="dropZoneHelp">여러 장을 한 번에 놓거나, PPT에서 복사한 뒤 여기를 눌러 <kbd>Ctrl+V</kbd> 하세요.</span>
          </div>
        </div>

        <div class="settings">
          <div class="setting-row">
            <div class="setting-head">
              <label for="threshold">투명도 기준</label>
              <output id="thresholdValue" for="threshold">8</output>
            </div>
            <input id="threshold" type="range" min="0" max="255" value="8">
          </div>

          <div class="setting-row">
            <div class="setting-head">
              <label for="padding">남길 여백</label>
              <output id="paddingValue" for="padding">0px</output>
            </div>
            <input id="padding" type="range" min="0" max="64" value="0">
          </div>

          <label class="checkbox download-option">
            <input id="downloadOriginalName" type="checkbox" checked>
            원본 파일명에 -trimmed 붙여서 저장
          </label>
        </div>
      </aside>

      <section class="preview">
        <div class="status" id="status">아직 이미지가 없습니다.</div>

        <div class="empty" id="emptyState">
          <div>업로드 후 파일별 원본과 잘라낸 결과 미리보기가 여기에 표시됩니다.</div>
        </div>

        <div class="result-list" id="resultList" hidden></div>

        <div class="actions">
          <button class="secondary" id="copyButton" type="button" disabled>모두 복사</button>
          <button class="secondary office-only" id="insertPptButton" type="button" hidden disabled>모두 PPT에 넣기</button>
          <button id="downloadButton" type="button" disabled>모두 PNG 다운로드</button>
        </div>
      </section>
    </section>
  </main>

  <script>
    const fileInput = document.querySelector("#fileInput");
    const dropZone = document.querySelector("#dropZone");
    const resetButton = document.querySelector("#resetButton");
    const downloadButton = document.querySelector("#downloadButton");
    const copyButton = document.querySelector("#copyButton");
    const insertPptButton = document.querySelector("#insertPptButton");
    const threshold = document.querySelector("#threshold");
    const thresholdValue = document.querySelector("#thresholdValue");
    const padding = document.querySelector("#padding");
    const paddingValue = document.querySelector("#paddingValue");
    const status = document.querySelector("#status");
    const emptyState = document.querySelector("#emptyState");
    const resultList = document.querySelector("#resultList");
    const downloadOriginalName = document.querySelector("#downloadOriginalName");
    const subtitle = document.querySelector("#subtitle");
    const fileButton = document.querySelector("#fileButton");
    const dropZoneTitle = document.querySelector("#dropZoneTitle");
    const dropZoneHelp = document.querySelector("#dropZoneHelp");

    let imageItems = [];
    let isPowerPointReady = false;

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.classList.toggle("error", isError);
    }

    function drawImageToCanvas(canvas, image) {
      canvas.width = image.naturalWidth;
      canvas.height = image.naturalHeight;
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(image, 0, 0);
      return ctx;
    }

    function getTrimBounds(ctx, width, height, alphaThreshold) {
      const pixels = ctx.getImageData(0, 0, width, height).data;
      let minX = width;
      let minY = height;
      let maxX = -1;
      let maxY = -1;

      for (let y = 0; y < height; y += 1) {
        const row = y * width * 4;
        for (let x = 0; x < width; x += 1) {
          const alpha = pixels[row + x * 4 + 3];
          if (alpha > alphaThreshold) {
            if (x < minX) minX = x;
            if (y < minY) minY = y;
            if (x > maxX) maxX = x;
            if (y > maxY) maxY = y;
          }
        }
      }

      if (maxX === -1) {
        return null;
      }

      return { minX, minY, maxX, maxY };
    }

    function createResultItem(fileName) {
      const resultItem = document.createElement("article");
      resultItem.className = "result-item";
      resultItem.innerHTML = `
        <div class="result-top">
          <div class="result-name" title=""></div>
          <div class="result-actions">
            <button class="secondary copy-one" type="button">복사</button>
            <button class="secondary office-only insert-one" type="button" hidden>PPT에 넣기</button>
            <button class="download-one" type="button">다운로드</button>
          </div>
        </div>
        <div class="result-body">
          <div class="comparison">
            <section class="pane">
              <div class="pane-header">
                <span>원본</span>
                <span class="original-meta"></span>
              </div>
              <div class="canvas-wrap">
                <canvas class="original-canvas"></canvas>
              </div>
            </section>
            <section class="pane">
              <div class="pane-header">
                <span>잘라낸 결과</span>
                <span class="trimmed-meta"></span>
              </div>
              <div class="canvas-wrap">
                <canvas class="trimmed-canvas"></canvas>
              </div>
            </section>
          </div>
        </div>
      `;

      const name = resultItem.querySelector(".result-name");
      name.textContent = fileName;
      name.title = fileName;

      return resultItem;
    }

    function trimItem(item) {
      const originalCanvas = item.originalCanvas;
      const trimmedCanvas = item.trimmedCanvas;
      const originalCtx = drawImageToCanvas(originalCanvas, item.image);
      const width = originalCanvas.width;
      const height = originalCanvas.height;
      const alphaThreshold = Number(threshold.value);
      const extraPadding = Number(padding.value);
      const bounds = getTrimBounds(originalCtx, width, height, alphaThreshold);

      item.originalMeta.textContent = `${width} x ${height}px`;

      if (!bounds) {
        trimmedCanvas.width = 1;
        trimmedCanvas.height = 1;
        trimmedCanvas.getContext("2d").clearRect(0, 0, 1, 1);
        item.trimmedMeta.textContent = "투명 이미지";
        item.valid = false;
        item.downloadButton.disabled = true;
        item.copyButton.disabled = true;
        return;
      }

      const sourceX = Math.max(0, bounds.minX - extraPadding);
      const sourceY = Math.max(0, bounds.minY - extraPadding);
      const sourceRight = Math.min(width - 1, bounds.maxX + extraPadding);
      const sourceBottom = Math.min(height - 1, bounds.maxY + extraPadding);
      const trimWidth = sourceRight - sourceX + 1;
      const trimHeight = sourceBottom - sourceY + 1;

      trimmedCanvas.width = trimWidth;
      trimmedCanvas.height = trimHeight;
      const trimmedCtx = trimmedCanvas.getContext("2d");
      trimmedCtx.clearRect(0, 0, trimWidth, trimHeight);
      trimmedCtx.drawImage(
        originalCanvas,
        sourceX,
        sourceY,
        trimWidth,
        trimHeight,
        0,
        0,
        trimWidth,
        trimHeight
      );

      item.trimmedMeta.textContent = `${trimWidth} x ${trimHeight}px`;
      item.valid = true;
      item.downloadButton.disabled = false;
      item.copyButton.disabled = !navigator.clipboard || !window.ClipboardItem;
    }

    function setPowerPointControlsVisible(isVisible) {
      document.querySelectorAll(".office-only").forEach((element) => {
        element.hidden = !isVisible;
      });
    }

    function updatePowerPointButtons() {
      const hasValidImage = imageItems.some((item) => item.valid);
      insertPptButton.disabled = !isPowerPointReady || !hasValidImage;

      imageItems.forEach((item) => {
        if (item.insertButton) {
          item.insertButton.hidden = !isPowerPointReady;
          item.insertButton.disabled = !isPowerPointReady || !item.valid;
        }
      });
    }

    function trimImages() {
      if (!imageItems.length) return;

      imageItems.forEach(trimItem);
      const validCount = imageItems.filter((item) => item.valid).length;

      if (!validCount) {
        setStatus("불투명 픽셀이 있는 이미지가 없습니다. 투명도 기준을 낮춰보세요.", true);
        downloadButton.disabled = true;
        copyButton.disabled = true;
        updatePowerPointButtons();
        return;
      }

      setStatus(`${validCount}장의 이미지 처리가 완료됐습니다.`);
      downloadButton.disabled = false;
      copyButton.disabled = !navigator.clipboard || !window.ClipboardItem;
      updatePowerPointButtons();
    }

    function loadImage(file) {
      return new Promise((resolve) => {
        const objectUrl = URL.createObjectURL(file);
        const image = new Image();

        image.onload = () => {
          resolve({
            fileName: file.name || "image.png",
            image,
            objectUrl
          });
        };

        image.onerror = () => {
          URL.revokeObjectURL(objectUrl);
          resolve(null);
        };

        image.src = objectUrl;
      });
    }

    function revokeItems() {
      imageItems.forEach((item) => URL.revokeObjectURL(item.objectUrl));
    }

    async function loadFiles(fileList) {
      const files = Array.from(fileList || []).filter((file) => file.type.startsWith("image/"));

      if (!files.length) {
        setStatus("이미지 파일만 사용할 수 있습니다.", true);
        return;
      }

      revokeItems();
      imageItems = [];
      resultList.innerHTML = "";
      fileInput.value = "";
      emptyState.hidden = true;
      resultList.hidden = false;
      resetButton.disabled = false;
      downloadButton.disabled = true;
      copyButton.disabled = true;
      insertPptButton.disabled = true;
      setStatus(`${files.length}장의 이미지를 읽는 중입니다.`);

      const loadedItems = await Promise.all(files.map(loadImage));

      loadedItems.filter(Boolean).forEach((loaded) => {
        const element = createResultItem(loaded.fileName);
        const item = {
          ...loaded,
          element,
          originalCanvas: element.querySelector(".original-canvas"),
          trimmedCanvas: element.querySelector(".trimmed-canvas"),
          originalMeta: element.querySelector(".original-meta"),
          trimmedMeta: element.querySelector(".trimmed-meta"),
          downloadButton: element.querySelector(".download-one"),
          copyButton: element.querySelector(".copy-one"),
          insertButton: element.querySelector(".insert-one"),
          valid: false
        };

        item.downloadButton.addEventListener("click", () => downloadItem(item));
        item.copyButton.addEventListener("click", () => copyItem(item));
        item.insertButton.addEventListener("click", () => insertItemIntoPowerPoint(item));
        imageItems.push(item);
        resultList.append(element);
      });

      if (!imageItems.length) {
        resetApp();
        setStatus("이미지를 읽지 못했습니다.", true);
        return;
      }

      trimImages();
    }

    function getImageFilesFromClipboard(event) {
      const items = Array.from(event.clipboardData?.items || []);
      const imageItems = items.filter((item) => item.kind === "file" && item.type.startsWith("image/"));
      const preferredItem = imageItems.find((item) => item.type === "image/png") || imageItems[0];
      const file = preferredItem?.getAsFile();

      return file ? [file] : [];
    }

    function pasteClipboardImages(event) {
      const files = getImageFilesFromClipboard(event);

      if (!files.length) {
        return;
      }

      event.preventDefault();
      event.stopPropagation();
      loadFiles(files);
    }

    function getDownloadName(fileName, index = 0) {
      if (!downloadOriginalName.checked) {
        return imageItems.length > 1 ? `trimmed-image-${index + 1}.png` : "trimmed-image.png";
      }

      const dot = fileName.lastIndexOf(".");
      const base = dot > 0 ? fileName.slice(0, dot) : fileName;
      return `${base}-trimmed.png`;
    }

    function downloadItem(item) {
      if (!item.valid) return;

      const link = document.createElement("a");
      link.download = getDownloadName(item.fileName, imageItems.indexOf(item));
      link.href = item.trimmedCanvas.toDataURL("image/png");
      link.click();
    }

    function downloadAllImages() {
      imageItems.filter((item) => item.valid).forEach((item, index) => {
        const link = document.createElement("a");
        link.download = getDownloadName(item.fileName, index);
        link.href = item.trimmedCanvas.toDataURL("image/png");
        link.click();
      });
    }

    async function copyItem(item) {
      if (!item.valid || !navigator.clipboard || !window.ClipboardItem) return;

      try {
        await copyCanvasToClipboard(item.trimmedCanvas);
        setStatus(`${item.fileName} 결과 이미지를 클립보드에 복사했습니다.`);
      } catch {
        setStatus("브라우저가 이미지 클립보드 복사를 허용하지 않았습니다.", true);
      }
    }

    function canvasToBlob(canvas) {
      return new Promise((resolve, reject) => {
        canvas.toBlob((blob) => {
          if (blob) {
            resolve(blob);
            return;
          }

          reject(new Error("이미지를 만들지 못했습니다."));
        }, "image/png");
      });
    }

    async function copyCanvasToClipboard(canvas) {
      if (!navigator.clipboard || !window.ClipboardItem) {
        throw new Error("클립보드 복사를 지원하지 않습니다.");
      }

      const blob = await canvasToBlob(canvas);
      await navigator.clipboard.write([
        new ClipboardItem({ "image/png": blob })
      ]);
    }

    function canvasToBase64Png(canvas) {
      return canvas
        .toDataURL("image/png")
        .replace(/^data:image\/png;base64,/, "");
    }

    async function copyAllImages() {
      const validItems = imageItems.filter((item) => item.valid);

      if (!validItems.length) return;

      try {
        const clipboardItems = await Promise.all(validItems.map(async (item) => {
          const blob = await canvasToBlob(item.trimmedCanvas);
          return new ClipboardItem({ "image/png": blob });
        }));

        await navigator.clipboard.write(clipboardItems);
        setStatus(`${validItems.length}장의 결과 이미지를 클립보드에 복사했습니다.`);
      } catch {
        const message = validItems.length > 1
          ? "여러 이미지 동시 복사를 지원하지 않습니다. 모두 PPT에 넣기를 사용해보세요."
          : "브라우저가 이미지 클립보드 복사를 허용하지 않았습니다.";
        setStatus(message, true);
      }
    }

    async function addPictureToSelectedSlide(base64Image) {
      if (!window.PowerPoint || !PowerPoint.run) {
        throw new Error("PowerPoint 그림 추가 API를 사용할 수 없습니다.");
      }

      await PowerPoint.run(async (context) => {
        const selectedSlide = context.presentation.getSelectedSlides().getItemAt(0);

        if (!selectedSlide.shapes || typeof selectedSlide.shapes.addPicture !== "function") {
          throw new Error("PowerPoint 그림 추가 API를 사용할 수 없습니다.");
        }

        selectedSlide.shapes.addPicture(base64Image, {
          left: 36,
          top: 36
        });

        await context.sync();
      });
    }

    function insertImageBase64IntoPowerPoint(base64Image) {
      return new Promise((resolve, reject) => {
        Office.context.document.setSelectedDataAsync(
          base64Image,
          { coercionType: Office.CoercionType.Image },
          (result) => {
            if (result.status === Office.AsyncResultStatus.Failed) {
              reject(result.error);
              return;
            }

            resolve();
          }
        );
      });
    }

    async function insertNewImageIntoPowerPoint(base64Image, allowSelectionFallback = true) {
      try {
        await addPictureToSelectedSlide(base64Image);
      } catch {
        if (!allowSelectionFallback) {
          throw new Error("PowerPoint에서 여러 장 개별 삽입 API를 사용할 수 없습니다.");
        }

        await insertImageBase64IntoPowerPoint(base64Image);
      }
    }

    async function insertItemIntoPowerPoint(item) {
      if (!isPowerPointReady || !item.valid) return;

      try {
        insertPptButton.disabled = true;
        item.insertButton.disabled = true;
        setStatus(`${item.fileName} 결과 이미지를 PowerPoint에 넣는 중입니다.`);

        const base64Image = canvasToBase64Png(item.trimmedCanvas);

        await insertNewImageIntoPowerPoint(base64Image);
        setStatus(`${item.fileName} 결과 이미지를 현재 슬라이드에 넣었습니다.`);
      } catch (error) {
        const message = error && error.message ? error.message : "PowerPoint 삽입에 실패했습니다.";
        setStatus(message, true);
      } finally {
        updatePowerPointButtons();
      }
    }

    async function insertAllImagesIntoPowerPoint() {
      if (!isPowerPointReady) return;

      const validItems = imageItems.filter((item) => item.valid);

      if (!validItems.length) return;

      try {
        insertPptButton.disabled = true;
        validItems.forEach((item) => {
          item.insertButton.disabled = true;
        });
        setStatus(`${validItems.length}장의 결과 이미지를 PowerPoint에 넣는 중입니다.`);

        for (const item of validItems) {
          await insertNewImageIntoPowerPoint(canvasToBase64Png(item.trimmedCanvas), false);
        }

        setStatus(`${validItems.length}장의 결과 이미지를 현재 슬라이드에 넣었습니다.`);
      } catch (error) {
        const message = error && error.message ? error.message : "PowerPoint 삽입에 실패했습니다.";
        setStatus(message, true);
      } finally {
        updatePowerPointButtons();
      }
    }

    function resetApp() {
      revokeItems();
      imageItems = [];
      fileInput.value = "";
      resultList.innerHTML = "";
      emptyState.hidden = false;
      resultList.hidden = true;
      resetButton.disabled = true;
      downloadButton.disabled = true;
      copyButton.disabled = true;
      insertPptButton.disabled = true;
      setStatus("아직 이미지가 없습니다.");
    }

    function initializePowerPointIntegration() {
      if (!window.Office || !Office.onReady) {
        return;
      }

      Office.onReady((info) => {
        isPowerPointReady = info.host === Office.HostType.PowerPoint;
        document.body.classList.toggle("office-host", isPowerPointReady);
        setPowerPointControlsVisible(isPowerPointReady);
        updatePowerPointButtons();

        if (isPowerPointReady) {
          subtitle.textContent = "PPT에서 복사한 이미지의 투명 여백을 제거합니다.";
          fileButton.textContent = "파일 선택";
          copyButton.textContent = "모두 복사";
          insertPptButton.textContent = "모두 PPT에 넣기";
          dropZoneTitle.textContent = "복사한 이미지 붙여넣기";
          dropZoneHelp.innerHTML = "PPT에서 그림을 선택하고 <kbd>Ctrl+C</kbd>, 이 영역을 누른 뒤 <kbd>Ctrl+V</kbd>";

          if (!imageItems.length) {
            setStatus("PPT에서 복사한 이미지를 붙여넣으면 여백을 제거해 다시 넣을 수 있습니다.");
          }
        }
      });
    }

    fileInput.addEventListener("change", () => {
      loadFiles(fileInput.files);
    });

    dropZone.addEventListener("dragover", (event) => {
      event.preventDefault();
      dropZone.classList.add("dragging");
    });

    dropZone.addEventListener("dragleave", () => {
      dropZone.classList.remove("dragging");
    });

    dropZone.addEventListener("drop", (event) => {
      event.preventDefault();
      dropZone.classList.remove("dragging");
      loadFiles(event.dataTransfer.files);
    });

    document.addEventListener("paste", pasteClipboardImages);

    threshold.addEventListener("input", () => {
      thresholdValue.textContent = threshold.value;
      trimImages();
    });

    padding.addEventListener("input", () => {
      paddingValue.textContent = `${padding.value}px`;
      trimImages();
    });

    downloadButton.addEventListener("click", downloadAllImages);
    copyButton.addEventListener("click", copyAllImages);
    insertPptButton.addEventListener("click", insertAllImagesIntoPowerPoint);
    resetButton.addEventListener("click", resetApp);
    initializePowerPointIntegration();
  </script>
</body>
</html>
